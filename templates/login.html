<!DOCTYPE html>
<html>
<head>
    <title>Login / Register - Binance AI</title>
    <link rel="icon" href="https://cryptologos.cc/logos/binance-coin-bnb-logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container">
        {error_html}
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="display: inline-block; background: #FCD535; width: 48px; height: 48px; border-radius: 50%; line-height: 48px; font-weight: bold; color: #0b0e11; font-size: 20px; margin-bottom: 16px;">AI</div>
            <h2>Welcome to Binance AI</h2>
            <p>Connect your account to securely store API keys and manage your Gemini Extension.</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <div id="loginForm" class="tab-content active">
            <form action="/login" method="post">
                <input type="hidden" name="redirect_uri" value="{redirect_uri}">
                <input type="hidden" name="state" value="{state}">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        
        <div id="registerForm" class="tab-content">
            <form action="/register" method="post">
                <input type="hidden" name="redirect_uri" value="{redirect_uri}">
                <input type="hidden" name="state" value="{state}">
                <input type="text" name="username" placeholder="New Username" required>
                <input type="password" name="password" placeholder="New Password" required>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + 'Form').classList.add('active');
        }
    </script>
</body>
</html>
